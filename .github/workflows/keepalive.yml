# Supabase 무료 프로젝트는 한동안 쓰지 않으면 일시 정지된다.
# 3일마다 테스트 서버와 운영 DB 에 가벼운 쿼리를 보내 정지를 막는다.
# (GitHub 예약 실행은 시각을 보장하지 않으므로 간격을 넉넉히 짧게 둔다)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [staging, prod]
    steps:
      - name: DB 에 select 1
        env:
          DB_URL: ${{ matrix.target == 'staging' && secrets.STAGING_DB_URL || secrets.PROD_DB_URL }}
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select 1"
