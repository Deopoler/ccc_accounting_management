# main 에 push 하면 테스트 → 운영 DB 마이그레이션 / Edge Function → 웹 빌드 → GitHub Pages 배포.
# 새 앱이 새 컬럼을 조회하므로 DB 를 먼저 바꾸고 앱을 배포한다. 테스트가 실패하면 DB 도 바꾸지 않는다.
#
# 필요한 저장소 설정
#   Settings > Secrets and variables > Actions > Secrets
#     SUPABASE_URL              https://<ref>.supabase.co
#     SUPABASE_PUBLISHABLE_KEY  sb_publishable_...
#     PROD_DB_URL               운영 Session pooler 접속 문자열 (DB 비밀번호 포함)
#     PROD_PROJECT_REF          운영 프로젝트 ref
#     SUPABASE_ACCESS_TOKEN     Edge Function 배포용 (Supabase 계정 Access Token)
#   Settings > Environments > production (선택: Required reviewers 로 운영 DB 변경 전 승인)
#   Settings > Pages > Build and deployment > Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  supabase:
    needs: test
    runs-on: ubuntu-latest
    # Required reviewers 를 설정하면 여기서 승인을 기다린다. (환경이 없으면 자동으로 만들어진다)
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 마이그레이션 적용 (운영)
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          supabase migration list --db-url "$DB_URL"
          supabase db push --db-url "$DB_URL" --yes

      - name: Edge Function 배포 (운영)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-members --project-ref "${{ secrets.PROD_PROJECT_REF }}"

  build:
    needs: supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Supabase 접속 정보 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::저장소 Secrets 에 SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY 를 설정해 주세요."
            exit 1
          fi

      # <아이디>.github.io 저장소면 루트, 그 외에는 /<저장소 이름>/ 에서 서비스된다.
      - name: base href 결정
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get

      - name: 웹 빌드
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release \
            --base-href "${{ steps.base.outputs.href }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # GitHub Pages 는 SPA rewrite 가 없으므로, 없는 경로(/home 새로고침 등)에서
      # 404.html 로 같은 앱을 띄워 라우터가 처리하게 한다.
      - name: SPA 대체 페이지
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
