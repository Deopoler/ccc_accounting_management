# 작업 브랜치(feature/**)에 push 하면 테스트 → 테스트 서버에 마이그레이션 / Edge Function 적용.
# 앱은 로컬에서 env.staging.json 으로 띄워 확인한다. (README 3-1)
#
# 필요한 저장소 Secrets
#   STAGING_DB_URL         테스트 서버 Session pooler 접속 문자열 (DB 비밀번호 포함)
#   STAGING_PROJECT_REF    테스트 서버 프로젝트 ref
#   SUPABASE_ACCESS_TOKEN  Edge Function 배포용 (Supabase 계정 Access Token)
name: Staging

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

# 테스트 서버 DB 는 하나이므로 적용이 겹치지 않게 한다.
concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  supabase:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: 마이그레이션 적용 (테스트 서버)
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          supabase migration list --db-url "$DB_URL"
          supabase db push --db-url "$DB_URL" --yes

      - name: Edge Function 배포 (테스트 서버)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-members --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
