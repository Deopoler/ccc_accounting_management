name: ccc_accounting_management
description: "CCC 동아리 회계 관리 시스템 (Flutter Web + Supabase)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  material_ui: ^1.5.0
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  csv: ^8.0.0
  file_picker: ^13.1.0
  web: ^1.1.1
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Pretendard-LICENSE.txt
    # 확장 한글 8,822자(KS X 1001 외 현대 한글): fonts 에 넣지 않아 초기 부팅 시 받지 않고 첫 화면 뒤 지연 로드한다.
    # 폰트를 재생성하면 lib/core/theme/font_loader.dart 의 extFontCacheName 버전을 함께 올려야 한다.
    - assets/fonts/PretendardExt-Regular.ttf
    - assets/fonts/PretendardExt-Bold.ttf

  # Pretendard 기본(Core): KS X 1001 상용 한글 2,350자 + 자모·기호 (tool/fonts/build_fonts.mjs 로 생성, SIL OFL 1.1)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
