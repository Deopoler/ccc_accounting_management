name: ccc_accounting_management
description: "CCC 동아리 회계 관리 시스템 (Flutter Web + Supabase)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  material_ui: ^1.5.0
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  csv: ^8.0.0
  file_picker: ^13.1.0
  web: ^1.1.1
  cupertino_icons: ^1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  # Noto Sans KR: 현대 한글 11,172자 전체 포함 (tool/fonts/build_fonts.mjs 로 생성, SIL OFL 1.1)
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
