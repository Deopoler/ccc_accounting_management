<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    루트가 아닌 경로에 배포한다면 `flutter build web --base-href /경로/` 로 바꾼다.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CCC 교재 신청 및 이벤트 송금 관리">
  <!-- 동아리 내부용: 검색엔진에 노출하지 않는다. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111217" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CCC 회계">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CCC 회계</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter 엔진을 내려받는 동안 보여줄 로딩 화면 */
    body { margin: 0; background: #FFFFFF; }
    #app-loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #191F28;
      transition: opacity .2s ease-out;
    }
    #app-loading .spinner {
      width: 36px; height: 36px;
      border: 4px solid #E8F3FF; border-top-color: #0064FF; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    #app-loading p { margin: 0; font-size: 15px; font-weight: 600; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* 다크 모드 기기: 앱이 뜨기 전에도 어둡게 */
    @media (prefers-color-scheme: dark) {
      body { background: #111217; }
      #app-loading { color: #ECEEF1; }
      #app-loading .spinner { border-color: #17294A; border-top-color: #3D8BFF; }
    }
  </style>
</head>
<body>
  <div id="app-loading" aria-live="polite">
    <div class="spinner"></div>
    <p>CCC 회계 불러오는 중…</p>
  </div>
  <script>
    // Flutter 가 첫 화면을 그리면 로딩 화면을 없앤다.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
